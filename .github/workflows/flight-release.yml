name: Flight release bridge

# Publishes the conformant wasm facade whenever Flight publishes, on the channel Flight names.
#
# Flight uses locked versioning: every package ships at the family version whether or not it changed.
# This package is part of that family, so it ships too, and Flight's version is authoritative.
# The submodule pin is incidental to that — it records which source the Rust was generated from, not
# which release this package belongs to, and it routinely lags the released commit by commits that
# never touched their substituted packages.
#
# So the gate is behavioral, not identity-based: install the Flight packages just published and run
# its compile-time API contract, full upstream conformance suite, and published-package differential
# suite. That answers the question a consumer actually has — does the wasm facade implement the
# dispatched contract — where commit comparison answered only by proxy.
#
# See docs/release-bridge.md for the sending side.

on:
  repository_dispatch:
    types: [flight-release, flight-snapshot]
  workflow_dispatch:
    inputs:
      version:
        description: The exact Flight version to publish (e.g. 0.4.0-next.1685.a1b2c3d)
        required: true
      dist_tag:
        description: The npm dist-tag to move
        required: true
        default: latest
        type: choice
        options: [latest, edge, next]
      commit:
        description: The Flight commit the build came from (optional, reported only)
        required: false

concurrency:
  # A dist-tag is one mutable pointer. Serialize each channel independently so an older publish
  # cannot finish second and leave the pointer behind, while next/edge do not block latest. The
  # `latest` default matches the env block below, so a dispatch that omits the channel locks the
  # pointer it will actually move rather than collapsing every channel onto one empty group name.
  group: release-${{ github.event.client_payload.dist_tag || inputs.dist_tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish the Flight version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # `client_payload` is attacker-controllable in principle: anyone who can call the dispatch API
      # sets it. Passing it through `env` keeps it out of the shell's parse step, so a crafted value
      # is data rather than a command. Never interpolate these directly into a `run:` block.
      FLIGHT_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      FLIGHT_COMMIT: ${{ github.event.client_payload.commit || inputs.commit }}
      #
      # `latest` is the default because Flight's release workflow does not send a channel. Its
      # dispatch carries `version` and `commit` only, and its own comment treats that payload as
      # fixed, so requiring `dist_tag` made every real release dispatch fail `Validate payload`
      # before checkout. Defaulting is safe rather than permissive: the prerelease guard below still
      # refuses a hyphenated version on `latest`, so an untagged snapshot is REFUSED here instead of
      # being promoted to the channel ordinary installs read.
      DIST_TAG: ${{ github.event.client_payload.dist_tag || inputs.dist_tag || 'latest' }}

    steps:
      - name: Validate payload
        run: |
          set -euo pipefail
          [ -n "${FLIGHT_VERSION}" ] || { echo "::error::empty version"; exit 1; }
          if [[ ! "${FLIGHT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::unexpected version '${FLIGHT_VERSION}'"
            exit 1
          fi
          case "${DIST_TAG}" in
            latest|edge|next) ;;
            *) echo "::error::unexpected dist_tag '${DIST_TAG}'"; exit 1 ;;
          esac
          # A hyphen denotes a prerelease. Even a malformed dispatcher must never move `latest`
          # to one, because that changes what ordinary npm installs receive.
          case "${FLIGHT_VERSION}:${DIST_TAG}" in
            *-*:latest)
              echo "::error::refusing prerelease ${FLIGHT_VERSION} on latest"
              exit 1
              ;;
          esac

      # The duplicate gate needs repository code to discover the complete publishable set. Keep the
      # expensive submodule checkout and Rust setup below that gate: retries are frequent on the
      # snapshot channels, and an already-complete release should remain cheap.
      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Skip if every package is already published
        id: gate
        # Dispatch retries and duplicates are normal. npm versions are immutable, so treating a
        # complete version as success is both safe and the only idempotent behavior. Do not skip a
        # partial release: the publisher itself skips existing packages and finishes the remainder.
        run: |
          set -euo pipefail
          all_published=true
          package_count=0
          while IFS= read -r package_name; do
            [ -n "${package_name}" ] || continue
            package_count=$((package_count + 1))
            if npm view "${package_name}@${FLIGHT_VERSION}" version >/dev/null 2>&1; then
              echo "${package_name}@${FLIGHT_VERSION} is already published"
            else
              echo "${package_name}@${FLIGHT_VERSION} still needs publishing"
              all_published=false
            fi
          done < <(npx tsx scripts/publishable-packages.ts --names)

          if [ "${package_count}" -eq 0 ]; then
            echo "::error::No publishable packages were discovered."
            exit 1
          fi
          if [ "${all_published}" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the upstream source
        if: steps.gate.outputs.skip != 'true'
        run: git submodule update --init --recursive
      - name: Fetch upstream history and tags
        if: steps.gate.outputs.skip != 'true'
        # A tag object alone cannot cross a shallow boundary; version derivation needs its ancestry.
        run: |
          if [ "$(git -C upstream rev-parse --is-shallow-repository)" = "true" ]; then
            git -C upstream fetch --tags --force --unshallow origin
          else
            git -C upstream fetch --tags --force origin
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/rust

      - name: Report how this port relates to the release
        if: steps.gate.outputs.skip != 'true'
        # Informational only. A lagging pin is the normal case under locked versioning, and the
        # parity run below is what decides whether it matters. Recording it in the run's summary
        # means a later "which source was 0.4.0 built from" question has an answer.
        run: |
          pinned="$(git -C upstream rev-parse HEAD)"
          derived="$(npx tsx scripts/flight-version.ts || echo unknown)"
          {
            echo "### Flight release ${FLIGHT_VERSION}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Released commit | \`${FLIGHT_COMMIT:-not supplied}\` |"
            echo "| Pinned commit | \`${pinned}\` |"
            echo "| Version derived from the pin | \`${derived}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${FLIGHT_COMMIT}" ] && [ "${pinned}" != "${FLIGHT_COMMIT}" ]; then
            echo "::notice::Pinned at ${pinned}, Flight released ${FLIGHT_COMMIT}. Expected under locked versioning; parity against the published package decides whether it matters."
          fi
          if [ "${derived}" != "${FLIGHT_VERSION}" ]; then
            echo "::notice::This pin derives ${derived}; publishing as ${FLIGHT_VERSION} because Flight releases the whole family together."
          fi

      - name: Install the Flight packages being released
        if: steps.gate.outputs.skip != 'true'
        # npm can take a moment to serve a version the publish just created, so this retries rather
        # than failing the release on propagation.
        run: |
          for attempt in 1 2 3 4 5; do
            if npm install --no-save \
              "@flighthq/bitmap@${FLIGHT_VERSION}" \
              "@flighthq/types@${FLIGHT_VERSION}"; then
              exit 0
            fi
            echo "attempt ${attempt} failed; waiting for the registry"
            sleep 30
          done
          echo "::error::The Flight bitmap dependencies at ${FLIGHT_VERSION} did not become installable."
          exit 1

      - name: Verify parity against the released package
        if: steps.gate.outputs.skip != 'true'
        # The real gate. The typecheck compares the complete facade surface to the exact package
        # named by the dispatch; the differential suite checks Rust behavior against it. Either form
        # of API drift fails this workflow before the manifest is stamped or anything is published.
        run: |
          npm run typecheck:published
          npx vitest run --config packages/bitmap-wasm/vitest.config.published.ts

      # Scoped to the artifact, not the repository. The full suite also carries generator
      # bookkeeping — compiled-candidate counts, lowering coverage, conformance shape — which moves
      # when UPSTREAM changes and says nothing about whether this tarball works. A Flight release
      # must not be blocked from shipping the port because an unrelated upstream package arrived.
      #
      # BEFORE the stamp, not after. `publishing.test.ts` asserts the in-repo dependency range tracks
      # the version derived from the pin — a repository invariant that the stamp below deliberately
      # overrides with the RELEASED version. Running it afterwards asserts the opposite of what the
      # next step just did, and fails on every release where the released and derived versions differ,
      # which under locked versioning is the ordinary case.
      - name: Verify the artifact
        if: steps.gate.outputs.skip != 'true'
        run: npm run test:release

      - name: Stamp the manifest
        if: steps.gate.outputs.skip != 'true'
        # The dependency range moves with the version because parity above demonstrated compatibility
        # with exactly those published packages.
        run: npx tsx scripts/version-packages.ts "${FLIGHT_VERSION}" --flight "${FLIGHT_VERSION}"

      - name: Re-check the packaging invariants after stamping
        if: steps.gate.outputs.skip != 'true'
        # Version-agnostic, so it is safe on the stamped manifest and catches a stamp that produced
        # something unpublishable.
        run: npx vitest run tests/generator/facade-packaging.test.ts

      - name: Publish
        if: steps.gate.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_PROVENANCE != 'false' }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN is not configured; running a dry run instead of publishing."
            npm run release -- --dry-run --tag "${DIST_TAG}"
          else
            npm run release -- --tag "${DIST_TAG}"
          fi
