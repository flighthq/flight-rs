name: CI

# Five independent lanes. None of them `needs:` another, deliberately — they answer different
# questions and one being red must not hide the others.
#
#   Generate   Is the committed output reproducible, and does it clear the coverage ratchets?
#   Quality    Do the TypeScript sources typecheck, lint, and format?
#   Tests      Does the whole suite pass, generator bookkeeping included?
#   Package    Does the shippable wasm package build and behave?
#   Rust       Does the generated Rust compile and pass its own tests?
#
# `Generate` runs `generate:check`, which carries the ratchets — exhaustive lowering coverage, golden
# counts, report freshness. Those move when UPSTREAM changes: a package this port does not touch can
# arrive and turn the lane red through no fault of anything here. That is a useful signal and worth
# gating a merge on, but it is NOT the question "can we still ship". `Package` answers that one on its
# own, so a red ratchet no longer hides whether the artifact builds — and a green Package with a red
# Generate is a legible, actionable state rather than a mystery.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # upstream/ is the generator's only input. Without the submodule every generator job
          # fails on a missing source tree rather than on anything about the change.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/rust
      - run: npm ci
      # Regenerates all 153 packages and byte-compares against the committed tree, so this is also
      # where cross-machine determinism gets proven: the runner is neither developer's machine.
      - run: npm run generate:check

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Compiles the published facades against real upstream sources rather than local declaration
      # shims, which keeps the two sides from drifting apart silently.
      - run: npm run typecheck:upstream
      - run: npm run lint
      - run: npm run format:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch upstream history and tags
        # A tag object is not reachable through a shallow boundary even after `fetch --tags`.
        # flight-version.ts needs both the tag and the ancestry connecting it to the pin.
        run: |
          if [ "$(git -C upstream rev-parse --is-shallow-repository)" = "true" ]; then
            git -C upstream fetch --tags --force --unshallow origin
          else
            git -C upstream fetch --tags --force origin
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The generator tests compile Rust fixtures, so this lane needs the toolchain.
      - uses: ./.github/actions/rust
      - run: npm ci
      - run: npm run test

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch upstream history and tags
        # A tag object is not reachable through a shallow boundary even after `fetch --tags`.
        # flight-version.ts needs both the tag and the ancestry connecting it to the pin.
        run: |
          if [ "$(git -C upstream rev-parse --is-shallow-repository)" = "true" ]; then
            git -C upstream fetch --tags --force --unshallow origin
          else
            git -C upstream fetch --tags --force origin
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/rust
      - run: npm ci

      # `npm run wasm` regenerates in WRITE mode, which does not run the coverage ratchet — so this
      # lane reaches the compiler even when `Generate` is red. It is the step that would have caught
      # a facade crate failing to compile, which `generate:check` may not report if a coverage
      # ratchet fires first and stops the run.
      - name: Build the wasm module
        run: npm run wasm

      # Parity against the module just built, plus the packaging invariants and version logic.
      - name: Verify the artifact
        run: npm run test:release

      # Assembles the real tarball. The two remaining halves of `npm run build` are run directly
      # rather than through the script, because `build` starts with `npm run wasm` and the step above
      # already did that — invoking it again costs another full wasm compile. `--ignore-scripts` then
      # skips `prepack` for the same reason.
      #
      # This is the step that catches a `files` or glue-copy mistake: a tarball that installs and
      # then fails at import time is invisible to every unit test.
      - name: Pack the tarballs
        run: |
          while IFS= read -r package; do
            (
              cd "${package}"
              npx tsc -b
              npx tsx ./scripts/copy-wasm-glue.ts
              npm pack --ignore-scripts --pack-destination /tmp
            )
          done < <(npx tsx scripts/publishable-packages.ts)
          ls -l /tmp/*.tgz

      # Everything above tests the SOURCES. This installs what would actually be published and
      # imports it as a consumer would, which is the only way some defects are visible at all: a
      # tarball missing its wasm glue installs cleanly and fails at import, and an emitted `.d.ts`
      # referencing the wrong upstream module only breaks consumers who typecheck it. Both of those
      # shipped here undetected before this step existed.
      #
      # Installing also resolves the package's own declared dependency range against the registry, so
      # a range naming a version npm cannot serve fails here rather than for the first consumer.
      - name: Install and run the tarball as a consumer
        run: |
          npm install --no-save /tmp/flighthq-bitmap-wasm-*.tgz
          npx vitest run --config tests/consumer/vitest.config.ts

      # Typechecks a consumer against the tarball's EMITTED declarations, with `skipLibCheck: false`
      # so they are actually read. This is the check that would have caught the facade importing a
      # type from the wrong upstream module — a defect only visible to consumers who typecheck, and
      # invisible to every suite that compiles the sources instead.
      - name: Typecheck a consumer against the shipped declarations
        run: npx tsc -p tests/consumer/tsconfig.json

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/rust
      - run: npm ci
      - run: cargo test --workspace
      # A separate workspace, so `--workspace` above does not reach it.
      - run: npm run test:host-winit
