name: Release

# The MANUAL release path for the conformant wasm facade. Ordinary releases do not come through here —
# flight-release.yml publishes whenever Flight publishes, which is the only moment all substituted
# package dependencies at that exact stable or snapshot version are guaranteed to exist.
#
# This lane covers the two cases that are not a Flight release:
#   Tag        a bare numeric tag publishes that version under `latest` — a port-only fix that has to
#              ship between Flight releases. Cut one with:
#                npm run version:packages 0.4.1 && git commit -am "release: 0.4.1"
#                git tag 0.4.1 && git push --tags
#   Dispatch   publishes an <upstream>-edge.<count>.<sha> snapshot under the `edge` dist-tag, for
#              deliberately putting a pre-release build in front of someone.
#
# NOT triggered by pushes to main, deliberately. Under locked versioning this repository's pin can
# sit ahead of Flight's newest stable release, so an untagged build may declare dependency ranges npm
# cannot serve yet. Publishing a snapshot on every push would also invent a channel independently of
# Flight, on top of running a full wasm build per commit.

on:
  push:
    # Bare numeric version tags, no "v" prefix.
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

concurrency:
  # Share the receiver's per-tag lock: a manual/tag publish and a Flight dispatch can target the
  # same npm pointer. workflow_dispatch maps main -> edge and develop -> next in edge-version.ts.
  group: release-${{ github.ref_type == 'tag' && 'latest' || github.ref_name == 'develop' && 'next' || 'edge' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The submodule carries the version this port borrows, and fetch-depth: 0 feeds the
          # snapshot build count, which is `git rev-list --count`.
          submodules: recursive
          fetch-depth: 0
      - name: Fetch upstream history and tags
        # A submodule checkout may be shallow. Fetching tag objects without the intervening history
        # still leaves `git describe` unable to reach them from the pin.
        run: |
          if [ "$(git -C upstream rev-parse --is-shallow-repository)" = "true" ]; then
            git -C upstream fetch --tags --force --unshallow origin
          else
            git -C upstream fetch --tags --force origin
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Writes an .npmrc pointing at public npm and wires NODE_AUTH_TOKEN for the publish.
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/rust
      - run: npm ci

      - name: Install the declared Flight API
        # Port-only versions (for example 0.4.1) are not Flight versions, so this lane cannot install
        # the tag name. Resolve the dependency ranges the tarball will actually declare instead. A
        # consumer gets this API, and a release must fail if the facade no longer substitutes it.
        run: |
          bitmap_range="$(node -p "require('./packages/bitmap-wasm/package.json').dependencies['@flighthq/bitmap']")"
          types_range="$(node -p "require('./packages/bitmap-wasm/package.json').dependencies['@flighthq/types']")"
          npm install --no-save \
            "@flighthq/bitmap@${bitmap_range}" \
            "@flighthq/types@${types_range}"

      - name: Verify compatibility with the declared Flight API
        run: |
          npm run typecheck:published
          npx vitest run --config packages/bitmap-wasm/vitest.config.published.ts

      - name: Resolve version and dist-tag
        id: resolve
        # A tag publishes itself to `latest`; anything else is a snapshot on its channel. This calls
        # tsx directly rather than through `npm run`, because npm prints a banner to stdout that
        # would land in $GITHUB_OUTPUT and corrupt it.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf 'version=%s\ntag=latest\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            npx tsx scripts/edge-version.ts "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # This workflow triggers independently of ci.yml, so without a gate a red commit would still
      # publish — and a published version cannot be withdrawn, only deprecated.
      #
      # `test:release` rather than the whole suite, deliberately. CI verifies the REPOSITORY; a
      # release verifies the ARTIFACT. The suite also carries generator bookkeeping — how many
      # upstream packages compile, lowering coverage, conformance harvest shape — which moves when
      # UPSTREAM changes and says nothing about whether this tarball works. Gating a release on it
      # means an upstream package this port does not even touch can block shipping a fix.
      - name: Verify what is about to ship
        run: npm run test:release

      - name: Stamp the manifest
        run: npx tsx scripts/version-packages.ts "${{ steps.resolve.outputs.version }}"

      - name: Re-check the packaging invariants after stamping
        # Version-agnostic, so it is safe on the stamped manifest and catches a stamp that produced
        # something unpublishable.
        run: npx vitest run tests/generator/facade-packaging.test.ts

      # Publishing is skipped rather than failed when no token is configured, so this workflow does
      # not report red on every push before the secret exists. It starts publishing on its own once
      # the secret is added, with no edit here. The dry run still exercises the whole path — build,
      # pack, and the registry guards — so the lane is proven before it is ever armed.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance attests the tarball to this workflow run, and needs `id-token: write` above
          # plus a PUBLIC repository. npm rejects the publish outright on a private repository, so
          # this is opt-out through a repository variable rather than a value to discover at the
          # first real publish: set NPM_PROVENANCE to "false" if flight-rs is private.
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_PROVENANCE != 'false' }}
        # The release script performs one full wasm build, then assembles each publishable tarball from it.
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN is not configured; running a dry run instead of publishing."
            npm run release -- --dry-run --tag "${{ steps.resolve.outputs.tag }}"
          else
            npm run release -- --tag "${{ steps.resolve.outputs.tag }}"
          fi
